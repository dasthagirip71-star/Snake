<title>Rainbow Snake</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }

  html, body {
    height:100%;
    overflow:hidden;
    background:#0d0221;
    font-family:'Segoe UI', Arial, sans-serif;
    touch-action:none;
  }

  #bg {
    position:fixed; inset:0; z-index:0;
    perspective:600px;
    overflow:hidden;
    background:linear-gradient(160deg,#0d0221 0%, #1a0b3d 45%, #240b52 100%);
  }
  .orb {
    position:absolute;
    border-radius:50%;
    filter: blur(2px);
    opacity:0.5;
    transform-style:preserve-3d;
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translate3d(0,0,0) rotateX(0deg) rotateY(0deg) scale(1); }
    50%  { transform: translate3d(var(--dx), var(--dy), 120px) rotateX(180deg) rotateY(180deg) scale(1.3); }
    100% { transform: translate3d(0,0,0) rotateX(360deg) rotateY(360deg) scale(1); }
  }
  .grid3d {
    position:absolute; inset:-50%;
    background-image:
      linear-gradient(rgba(124,252,255,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,252,255,0.07) 1px, transparent 1px);
    background-size:40px 40px;
    transform: rotateX(70deg);
    animation: gridMove 6s linear infinite;
  }
  @keyframes gridMove {
    from { background-position: 0 0; }
    to   { background-position: 0 40px; }
  }

  #ui {
    position:relative; z-index:2;
    height:100%;
    width:100%;
    display:flex; flex-direction:column; align-items:center;
  }

  #topBar {
    position:fixed;
    top:0; left:0; right:0;
    z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(env(safe-area-inset-top,10px),10px) 16px 10px;
    background:transparent;
    pointer-events:none;
  }
  #topBar * { pointer-events:auto; }

  h1 {
    font-size:clamp(18px,5vw,24px);
    font-weight:800;
    letter-spacing:1.5px;
    background:linear-gradient(90deg,#ff4d4d,#ffb84d,#ffe14d,#4dff88,#4dd2ff,#b84dff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    background-size:300% auto;
    animation: hueMove 4s linear infinite;
    text-shadow:0 2px 12px rgba(0,0,0,0.4);
  }
  @keyframes hueMove {
    0% { background-position: 0% center; }
    100% { background-position: 300% center; }
  }

  #scoreboard {
    display:flex; gap:16px;
    font-size:14px; color:#e6dcff;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  #scoreboard b { color:#7CFCFC; font-size:17px; }

  #fsBtn {
    width:38px; height:38px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(6px);
    color:#fff;
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #fsBtn:active { background:rgba(255,255,255,0.2); }

  #gameWrap {
    position:absolute; inset:0;
    overflow:hidden;
  }
  #gameCanvas { display:block; width:100%; height:100%; touch-action:none; }

  #overlay {
    position:absolute; inset:0;
    z-index:4;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
    background:rgba(8,2,25,0.75);
    backdrop-filter: blur(6px);
    text-align:center;
    padding:20px;
  }
  #overlay.hidden { display:none; }
  #overlay p { color:#e6dcff; font-size:15px; max-width:80%; }
  #overlayTitle {
    font-size:clamp(20px,6vw,30px);
    font-weight:800;
    color:#fff;
  }
  #overlayScore { color:#ffe14d; font-weight:700; font-size:18px; }

  #startBtn {
    margin-top:6px;
    padding:14px 40px;
    font-size:18px;
    font-weight:800;
    letter-spacing:1px;
    border:none;
    border-radius:999px;
    color:#0d0221;
    background:linear-gradient(90deg,#4dd2ff,#4dff88);
    box-shadow: 0 8px 24px rgba(77,210,255,0.4);
    cursor:pointer;
  }
  #startBtn:active { transform:scale(0.96); }

  .hint {
    margin-top:12px;
    font-size:12.5px;
    color:#8f7fc7;
    text-align:center;
    max-width:85%;
  }
</style>
</head>
<body>

<div id="bg">
  <div class="grid3d"></div>
</div>

<div id="ui">
  <div id="topBar">
    <div>
      <h1>Dastagiri Snake</h1>
      <div id="scoreboard">
        <div>Score <b id="score">0</b></div>
        <div>Best <b id="best">0</b></div>
      </div>
    </div>
    <button id="fsBtn" title="Full screen">⛶</button>
  </div>

  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
      <div id="overlayTitle">Rainbow Snake</div>
      <p>Swipe up / down / left / right anywhere to move. Go off one edge, come back from the opposite edge — no walls!</p>
      <div id="overlayScore"></div>
      <button id="startBtn">Start Game</button>
      <div class="hint">Swipe to steer • Eat glowing food to grow • Careful not to hit yourself</div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('gameWrap');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayScore = document.getElementById('overlayScore');
  const startBtn = document.getElementById('startBtn');
  const fsBtn = document.getElementById('fsBtn');

  const GRID = 18;
  let cellW, cellH, dpr, boardW, boardH;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    boardW = wrap.clientWidth;
    boardH = wrap.clientHeight;
    canvas.width = boardW * dpr;
    canvas.height = boardH * dpr;
    canvas.style.width = boardW + 'px';
    canvas.style.height = boardH + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cellW = boardW / GRID;
    cellH = boardH / GRID;
  }
  window.addEventListener('resize', resize);

  fsBtn.addEventListener('click', ()=>{
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(()=>{});
    } else {
      document.exitFullscreen?.();
    }
  });
  document.addEventListener('fullscreenchange', ()=>{
    fsBtn.textContent = document.fullscreenElement ? '✕' : '⛶';
    resize();
  });

  const bg = document.getElementById('bg');
  const orbColors = ['#ff4d6d','#ffb84d','#4dff9e','#4dd2ff','#b84dff','#ffe14d'];
  for (let i=0;i<7;i++){
    const o = document.createElement('div');
    o.className='orb';
    const size = 60 + Math.random()*120;
    o.style.width = size+'px';
    o.style.height = size+'px';
    o.style.left = Math.random()*90+'%';
    o.style.top = Math.random()*90+'%';
    o.style.background = `radial-gradient(circle at 30% 30%, ${orbColors[i%orbColors.length]}, transparent 70%)`;
    o.style.setProperty('--dx', (Math.random()*160-80)+'px');
    o.style.setProperty('--dy', (Math.random()*160-80)+'px');
    o.style.animationDuration = (10+Math.random()*10)+'s';
    o.style.animationDelay = (-Math.random()*10)+'s';
    bg.appendChild(o);
  }

  let snake, direction, nextDirection, food, score, best, gameActive, tickDelay, lastTick, rafId;
  const RAINBOW = ['#ff4d6d','#ff9a4d','#ffe14d','#9aff4d','#4dffb8','#4ddbff','#4d8fff','#b84dff','#ff4dd2'];
  const FOOD_EMOJIS = ['🍎','🍇','🍓','🍒','🍊','🍋','🥝','🍉','🍑'];
  let currentFoodEmoji = '🍎';

  best = parseInt(localStorage.getItem('rainbowSnakeBest')) || 0;
  bestEl.textContent = best;

  function initGame() {
    resize();
    snake = [ { x:9,y:9 }, { x:8,y:9 }, { x:7,y:9 } ];
    direction = { x:1, y:0 };
    nextDirection = { x:1, y:0 };
    score = 0;
    scoreEl.textContent = score;
    tickDelay = 190;
    placeFood();
  }

  function placeFood() {
    let valid=false;
    while(!valid){
      food = { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
      valid = !snake.some(s=>s.x===food.x && s.y===food.y);
    }
    currentFoodEmoji = FOOD_EMOJIS[Math.floor(Math.random()*FOOD_EMOJIS.length)];
  }

  function draw3DCell(x, y, baseColor, isHead) {
    const px = x*cellW, py = y*cellH;
    const w = cellW, h = cellH;
    const cx = px + w/2, cy = py + h/2;
    const r = Math.min(w,h)/2 * (isHead ? 0.94 : 0.86);

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy + r*0.55, r*0.85, r*0.35, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.filter = 'blur(2px)';
    ctx.fill();
    ctx.restore();

    const grad = ctx.createRadialGradient(
      cx - r*0.4, cy - r*0.4, r*0.15,
      cx, cy, r*1.05
    );
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.18, baseColor);
    grad.addColorStop(0.75, baseColor);
    grad.addColorStop(1, 'rgba(0,0,0,0.55)');

    ctx.save();
    ctx.shadowColor = baseColor;
    ctx.shadowBlur = isHead ? 16 : 9;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx - r*0.32, cy - r*0.32, r*0.28, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fill();

    return { cx, cy, r };
  }

  function draw() {
    ctx.clearRect(0,0,boardW,boardH);

    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for(let i=1;i<GRID;i++){
      ctx.beginPath(); ctx.moveTo(i*cellW,0); ctx.lineTo(i*cellW,boardH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*cellH); ctx.lineTo(boardW,i*cellH); ctx.stroke();
    }

    const fx = food.x*cellW + cellW/2, fy = food.y*cellH + cellH/2;
    const glow = ctx.createRadialGradient(fx,fy,2,fx,fy,cellW*1.1);
    glow.addColorStop(0,'rgba(255,255,255,0.9)');
    glow.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(fx,fy,cellW*1.1,0,Math.PI*2); ctx.fill();
    ctx.font = (Math.min(cellW,cellH)*0.85)+'px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(currentFoodEmoji, fx, fy+1);

    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const color = RAINBOW[i % RAINBOW.length];
      const info = draw3DCell(seg.x, seg.y, color, i === 0);

      if (i === 0) {
        const ex = info.cx + direction.x * info.r * 0.35;
        const ey = info.cy + direction.y * info.r * 0.35;
        const perpX = -direction.y, perpY = direction.x;
        ctx.fillStyle = '#0d0221';
        ctx.beginPath(); ctx.arc(ex + perpX*info.r*0.32, ey + perpY*info.r*0.32, info.r*0.13, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex - perpX*info.r*0.32, ey - perpY*info.r*0.32, info.r*0.13, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  function update(ts) {
    if (!gameActive) return;
    if (!lastTick) lastTick = ts;
    if (ts - lastTick >= tickDelay) {
      lastTick = ts;
      direction = nextDirection;

      const head = {
        x: (snake[0].x + direction.x + GRID) % GRID,
        y: (snake[0].y + direction.y + GRID) % GRID
      };

      if (snake.some(s=>s.x===head.x && s.y===head.y)) {
        return endGame();
      }

      snake.unshift(head);
      if (head.x===food.x && head.y===food.y){
        score += 10;
        scoreEl.textContent = score;
        tickDelay = Math.max(110, tickDelay - 1.5);
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }
    rafId = requestAnimationFrame(update);
  }

  function endGame(){
    gameActive = false;
    cancelAnimationFrame(rafId);
    lastTick = null;
    if (score > best){
      best = score;
      localStorage.setItem('rainbowSnakeBest', best);
      bestEl.textContent = best;
      overlayTitle.textContent = '🏆 New Best!';
    } else {
      overlayTitle.textContent = 'Game Over';
    }
    overlayScore.textContent = `Score: ${score}`;
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function setDirection(dx,dy){
    if (!gameActive) return;
    if (dx === -direction.x && dy === -direction.y) return;
    nextDirection = { x:dx, y:dy };
  }

  let touchStartX=0, touchStartY=0, touchActive=false;
  const SWIPE_THRESHOLD = 22;

  canvas.addEventListener('touchstart', e=>{
    const t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
    touchActive = true;
  }, {passive:true});

  canvas.addEventListener('touchmove', e=>{
    if (!touchActive) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > SWIPE_THRESHOLD || Math.abs(dy) > SWIPE_THRESHOLD){
      if (Math.abs(dx) > Math.abs(dy)){
        setDirection(dx>0?1:-1, 0);
      } else {
        setDirection(0, dy>0?1:-1);
      }
      touchStartX = t.clientX; touchStartY = t.clientY;
    }
  }, {passive:true});

  canvas.addEventListener('touchend', ()=>{ touchActive=false; }, {passive:true});

  document.addEventListener('keydown', e=>{
    switch(e.key){
      case 'ArrowUp': case 'w': setDirection(0,-1); break;
      case 'ArrowDown': case 's': setDirection(0,1); break;
      case 'ArrowLeft': case 'a': setDirection(-1,0); break;
      case 'ArrowRight': case 'd': setDirection(1,0); break;
    }
  });

  startBtn.addEventListener('click', ()=>{
    overlay.classList.add('hidden');
    initGame();
    gameActive = true;
    draw();
    rafId = requestAnimationFrame(update);
  });

  resize();
  initGame();
  draw();
</script>
</body>
  </html>
